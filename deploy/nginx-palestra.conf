# Reverse proxy per PalEstra su palestra.annino.dev.
#
#   sudo cp deploy/nginx-palestra.conf /etc/nginx/sites-available/palestra.conf
#   sudo ln -s /etc/nginx/sites-available/palestra.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d palestra.annino.dev
#
# certbot riscrive questo file aggiungendo il blocco TLS e il redirect da
# :80. HTTPS non e' opzionale: il cookie di sessione e' marcato `Secure` in
# produzione e su HTTP non verrebbe proprio inviato.

server {
    listen 80;
    listen [::]:80;
    server_name palestra.annino.dev;

    # I video degli atleti (milestone successiva) sono grossi.
    client_max_body_size 200M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Senza questo Next non sa di stare dietro TLS e genera link http://
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
