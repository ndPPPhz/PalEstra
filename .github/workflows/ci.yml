name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: palestra
          POSTGRES_PASSWORD: palestra
          POSTGRES_DB: palestra_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgres://palestra:palestra@127.0.0.1:5432/palestra_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run db:migrate
      - run: npm test

      # The spec is generated, not hand-written: a drift here means someone
      # changed the contract without regenerating the Swift client's source.
      - name: openapi.json è aggiornato
        run: |
          npm run openapi
          git diff --exit-code openapi/openapi.json

      - run: npm run build
